name: ci
on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dev-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/ci-security.sh
      - run: python3 -B -m unittest discover -s .github/scripts -p "test_*.py"
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal --target wasm32v1-none
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt --target wasm32v1-none
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar-cli.tar.gz
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar-cli.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/build-upstream.py
      - run: ./scripts/build-guard.sh
      - run: cargo +1.93.0 test --workspace --locked
      - run: cargo +1.93.0 fmt --all --check
  pr-description:
    name: PR description
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - run: python3 -B .github/scripts/check_pr_description.py
  ci:
    name: CI
    if: always()
    needs: [security, application, pr-description]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require standard CI, security and PR description
        env:
          SECURITY: ${{ needs.security.result }}
          APPLICATION: ${{ needs.application.result }}
          DESCRIPTION: ${{ needs.pr-description.result }}
        run: |
          test "$SECURITY" = success
          test "$APPLICATION" = success
          test "$DESCRIPTION" = success
