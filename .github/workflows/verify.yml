name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: ./scripts/ci-security.sh
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 scripts/check-compatibility.py
  application:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.91.0 --profile minimal --target wasm32v1-none
      - run: rustup toolchain install 1.93.0 --profile minimal --component clippy --component rustfmt --target wasm32v1-none
      - name: Install pinned Stellar CLI
        run: |
          curl -fsSL https://github.com/stellar/stellar-cli/releases/download/v28.1.0/stellar-cli-28.1.0-x86_64-unknown-linux-gnu.tar.gz -o /tmp/stellar-cli.tar.gz
          echo "c1680deee94301d33ada7a17f98411e642a4248c727afbd2e43050d345746462  /tmp/stellar-cli.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/stellar-cli.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: python3 scripts/build-upstream.py
      - run: ./scripts/build-guard.sh
      - run: cargo +1.93.0 test --workspace --locked
      - run: cargo +1.93.0 fmt --all --check
      - run: python3 scripts/verify-artifacts.py
      - run: git diff --exit-code -- evidence/upstream-build.json
      - name: Package verified contract artifacts
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts/release
          cp target/wasm32v1-none/release/mierkhat_guard.wasm artifacts/release/
          cp target/wasm32v1-none/release/mierkhat_migration.wasm artifacts/release/
          cp artifacts/upstream-build.json artifacts/release/
          cp evidence/upstream-build.json artifacts/release/deployed-upstream-build.json
          git rev-parse HEAD > artifacts/release/SOURCE_COMMIT
          cd artifacts/release
          sha256sum mierkhat_guard.wasm mierkhat_migration.wasm upstream-build.json deployed-upstream-build.json SOURCE_COMMIT > SHA256SUMS
      - name: Store verified WASM for deployment review
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 14
  ci:
    name: CI
    if: always()
    needs: [security, compatibility, application]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          SECURITY: ${{ needs.security.result }}
          COMPATIBILITY: ${{ needs.compatibility.result }}
          APPLICATION: ${{ needs.application.result }}
        run: |
          test "$SECURITY" = success
          test "$COMPATIBILITY" = success
          test "$APPLICATION" = success
